services:
  - type: web
    name: kcr-webapp
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STAFF_PASSWORD
        sync: false
