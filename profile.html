<a class="skip-link" href="#main">本文へスキップ</a><div id="appNavigation"></div><main id="main" class="main-content" tabindex="-1"><header class="page-heading"><p class="eyebrow">MY PROFILE</p><h1>あなたのことを、教えてください。</h1><p>来校情報を登録すると、キャンパス体験を始められます。</p></header><div class="narrow"><section class="card "><div class="section-heading"><h2>プロフィール情報</h2></div><form id="profileForm"><div class="form-group"><label for="fullName">氏名</label><input id="fullName" name="fullName" type="text" placeholder="山田 太郎" required autocomplete="name"></div><div class="form-group"><label for="schoolName">出身学校</label><input id="schoolName" name="schoolName" type="text" placeholder="〇〇高等学校" required autocomplete="organization"></div><div class="form-group"><label for="grade">学年</label><select id="grade" name="grade"><option value="">選択してください</option><option value="1">1年</option><option value="2">2年</option><option value="3">3年</option><option value="既卒生">既卒生</option></select></div><button type="submit" class="btn btn-primary btn-block">保存してホームへ →</button><p class="form-status" role="status"></p></form></section></div></main><footer class="site-footer">KCR CAMPUS <span>今日の体験を、未来のきっかけに。</span></footer><div id="notifications" class="notifications" role="status" aria-live="polite"></div></body></html>
