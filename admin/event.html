<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イベント管理（管理者用）</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/env.js" defer></script>
  <script src="js/event.js" defer></script>
</head>
<body class="admin-body">

  <div class="admin-header">
    <a href="index.html" class="nav-link">‹ ダッシュボードへ</a>
    <h2>📅 イベント管理</h2>
  </div>

  <div class="admin-container">
    
    <!-- 1. 新規作成 / 編集 フォーム -->
    <div class="card admin-card">
      <h3 id="formTitle">イベント作成</h3>
      <form id="eventForm">
        <input type="hidden" id="eventId">

        <div class="form-group">
          <label for="eventTitle">イベント名</label>
          <input type="text" id="eventTitle" class="form-control" placeholder="例: 理学療法学科 オープンキャンパス" required>
        </div>

        <div class="form-group">
          <label for="eventDate">開催年月日</label>
          <input type="date" id="eventDate" class="form-control" required>
        </div>

        <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="isNew" checked style="width: 18px; height: 18px; cursor: pointer;">
          <label for="isNew" style="margin: 0; cursor: pointer; font-weight: normal;">新規イベントとして「NEW」バッジを表示する</label>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 15px;">
          <button type="submit" id="saveBtn" class="btn btn-primary">登録する</button>
          <button type="button" id="cancelEditBtn" class="btn" style="display: none; background: #8e8e93; color: white;">キャンセル</button>
        </div>
      </form>
    </div>

    <!-- 2. 登録済みイベント一覧 -->
    <div class="card admin-card">
      <h3>登録済みイベント一覧</h3>
      <div id="adminEventList">
        <p style="text-align: center; color: #888;">読み込み中...</p>
      </div>
    </div>

  </div>

</body>
</html>
