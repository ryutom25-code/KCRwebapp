<a class="skip-link" href="#main">本文へスキップ</a><div id="appNavigation"></div><main id="main" class="main-content" tabindex="-1"><header class="page-heading"><p class="eyebrow">QUIZ STUDIO</p><h1 id="quizPageTitle">クイズを管理する。</h1><p id="quizPageDescription">作成済みのクイズを確認・編集できます。新しいセットは「新規作成」から追加してください。</p></header><section id="quizListView" class="card"><div class="quiz-manager-toolbar"><div><h2>作成済みのクイズ</h2><p class="muted">問題文・選択肢・正解を編集できます。</p></div><div class="button-row"><button id="reloadQuizzes" type="button" class="btn btn-secondary">再読み込み</button><button id="newQuizBtn" type="button" class="btn btn-primary" aria-controls="quizCreateView">＋ 新規作成</button></div></div><div id="quizManagementList" aria-live="polite"><p class="empty">読み込み中…</p></div></section><section id="quizCreateView" hidden><div class="quiz-manager-toolbar"><button id="backToQuizList" type="button" class="btn btn-secondary">← 一覧へ戻る</button><span class="muted">新規クイズセット・全4問</span></div><form id="createFullQuizForm"><section class="card "><div class="section-heading"><h2>01 / セットの基本情報</h2></div><div class="filter-grid"><div class="form-group"><label for="deptSelect">対象学科</label><select id="deptSelect" name="deptSelect"><option value="PT">理学療法学科</option><option value="OT">作業療法学科</option><option value="Ns">看護学科</option><option value="CW">介護福祉学科</option><option value="IS">情報システム学科</option></select></div><div class="form-group"><label for="setTitleInput">セットタイトル</label><input id="setTitleInput" name="setTitleInput" type="text" placeholder="例：はじめての学科クイズ" required></div></div></section><div id="questionsContainer" class="question-grid"></div><div class="sticky-actions"><span class="muted">すべての入力内容を確認してください</span><button class="btn btn-primary" type="submit">4問セットを登録する →</button></div></form></section></main><footer class="site-footer">KCR CAMPUS <span>今日の体験を、未来のきっかけに。</span></footer><div id="notifications" class="notifications" role="status" aria-live="polite"></div></body></html>
