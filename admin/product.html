<a class="skip-link" href="#main">本文へスキップ</a><div id="appNavigation"></div><main id="main" class="main-content" tabindex="-1"><header class="page-heading"><p class="eyebrow">PRODUCT MANAGEMENT</p><h1>景品を、もっと魅力的に。</h1><p>景品の新規登録・編集・削除を行えます。</p></header><div class="editor-layout"><section class="card"><h2 id="formTitle">景品を登録</h2><form id="productForm"><input id="productId" type="hidden"><input id="currentImageUrl" type="hidden"><div class="form-group"><label for="productName">景品名</label><input id="productName" name="productName" type="text" placeholder="例：オリジナルボールペン" required></div><div class="form-group"><label for="productPoints">必要ポイント</label><select id="productPoints" name="productPoints"><option value="50">50 PT</option><option value="100">100 PT</option><option value="150">150 PT</option><option value="250">250 PT</option></select></div><div class="form-group"><label for="productImage">景品画像</label><input id="productImage" name="productImage" type="file" placeholder="" accept="image/*"></div><p class="hint">選択した画像は自動で圧縮されます。</p><div id="imagePreviewContainer" style="display:none"><img id="imagePreview" class="image-preview" alt="景品画像のプレビュー"></div><div class="button-row"><button id="saveBtn" class="btn btn-primary" type="submit">登録する</button><button id="cancelEditBtn" class="btn btn-secondary" type="button" style="display:none">キャンセル</button></div></form></section><section class="card"><div class="section-heading"><h2>登録済みの景品</h2></div><div id="adminProductList"><p class="empty" role="status">読み込み中…</p></div></section></div></main><footer class="site-footer">KCR CAMPUS <span>今日の体験を、未来のきっかけに。</span></footer><div id="notifications" class="notifications" role="status" aria-live="polite"></div></body></html>
