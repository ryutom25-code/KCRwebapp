<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品管理（管理者用）</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/env.js" defer></script>
  <script src="js/product.js" defer></script>
</head>
<body class="admin-body">

  <div class="admin-header">
    <a href="index.html" class="nav-link">‹ ダッシュボードへ</a>
    <h2>🎁 商品管理</h2>
  </div>

  <div class="admin-container">
    
    <!-- 1. 新規作成 / 編集 フォーム -->
    <div class="card admin-card">
      <h3 id="formTitle">商品を登録</h3>
      <form id="productForm">
        <input type="hidden" id="productId">
        <input type="hidden" id="currentImageUrl">

        <div class="form-group">
          <label for="productName">商品名</label>
          <input type="text" id="productName" class="form-control" placeholder="例: オリジナルシャープペン" required>
        </div>

        <div class="form-group">
          <label for="productPoints">必要ポイント</label>
          <select id="productPoints" class="form-control" required>
            <option value="50">50 PT</option>
            <option value="100">100 PT</option>
            <option value="150">150 PT</option>
            <option value="250">250 PT</option>
          </select>
        </div>

        <div class="form-group">
          <label for="productImage">商品画像</label>
          <input type="file" id="productImage" class="form-control" accept="image/*">
          <div id="imagePreviewContainer" style="margin-top: 10px; display: none;">
            <p style="font-size: 0.8rem; color: #666; margin-bottom: 4px;">現在の画像:</p>
            <img id="imagePreview" src="" style="max-width: 120px; max-height: 120px; border-radius: 8px; border: 1px solid #ddd;">
          </div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 15px;">
          <button type="submit" id="saveBtn" class="btn btn-primary">登録する</button>
          <button type="button" id="cancelEditBtn" class="btn" style="display: none; background: #8e8e93; color: white;">キャンセル</button>
        </div>
      </form>
    </div>

    <!-- 2. 登録済み商品一覧 -->
    <div class="card admin-card">
      <h3>登録済み商品一覧</h3>
      <div id="adminProductList">
        <p style="text-align: center; color: #888;">読み込み中...</p>
      </div>
    </div>

  </div>

</body>
</html>
