<a class="skip-link" href="#main">本文へスキップ</a><div id="appNavigation"></div><main id="main" class="main-content" tabindex="-1"><header class="page-heading"><p class="eyebrow">QR GENERATOR</p><h1>体験の入口を、つくろう。</h1><p>学科や景品交換用のQRコードを発行し、会場に掲示できます。</p></header><div class="editor-layout"><section class="card "><div class="section-heading"><h2>発行するQRを選択</h2></div><div class="preset-btns"><button class="preset-btn" type="button" data-qr="PT" data-label="理学療法学科 来校ポイント"><strong>PT</strong><span>理学療法学科</span></button><button class="preset-btn" type="button" data-qr="OT" data-label="作業療法学科 来校ポイント"><strong>OT</strong><span>作業療法学科</span></button><button class="preset-btn" type="button" data-qr="Ns" data-label="看護学科 来校ポイント"><strong>Ns</strong><span>看護学科</span></button><button class="preset-btn" type="button" data-qr="CW" data-label="介護福祉学科 来校ポイント"><strong>CW</strong><span>介護福祉学科</span></button><button class="preset-btn" type="button" data-qr="IS" data-label="情報システム学科 来校ポイント"><strong>IS</strong><span>情報システム学科</span></button><button type="button" class="preset-btn exchange-preset" data-qr="EXCHANGE_BOOTH" data-label="景品交換ブース"><strong>◇</strong><span>景品交換ブース</span></button></div><hr><label for="boothInput">イベント用QRを作成</label><div class="input-row"><input id="boothInput" placeholder="イベント名を入力"><button id="customQrBtn" type="button" class="btn btn-primary">作成</button></div></section><section id="resultCard" class="card qr-preview-card" style="display:none"><span class="eyebrow">READY TO SCAN</span><h2 id="boothLabel"></h2><div id="qrcode"></div><p id="boothIdText" class="muted"></p><p class="hint">印刷して、会場の見やすい場所に掲示してください。</p><button id="printBtn" type="button" class="btn btn-primary btn-block">QRコードを印刷</button></section></div></main><footer class="site-footer">KCR CAMPUS <span>今日の体験を、未来のきっかけに。</span></footer><div id="notifications" class="notifications" role="status" aria-live="polite"></div></body></html>
