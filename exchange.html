<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>景品交換</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- カメラ読み取り用ライブラリ -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="js/env.js" defer></script>
  <script src="js/auth-check.js" defer></script>
  <script src="js/exchange.js" defer></script>
  <!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#007aff">

<!-- iOS（Safari）対応設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OCアプリ">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>

  <div class="header">
    <a href="home.html" class="back-btn">‹ ホーム</a>
    <h2>ポイント景品交換</h2>
  </div>

  <div class="container" style="padding: 15px;">
    
    <!-- 所持ポイント表示 -->
    <div class="card" style="background: linear-gradient(135deg, #ff9500, #ff5e00); color: white; margin-bottom: 20px; text-align: center;">
  <div style="font-size: 0.85rem; opacity: 0.9;">現在の所持ポイント</div>
  <div id="userPoints" style="font-size: 2rem; font-weight: bold; margin-top: 4px;">-- PT</div>
  <!-- 💡 日付表示エリアを追加 -->
  <div id="currentDate" style="font-size: 0.8rem; opacity: 0.85; margin-top: 6px;">--/--</div>
</div>

    <!-- 商品一覧 -->
    <h3 style="margin-bottom: 12px; font-size: 1rem; color: #333;">交換可能な景品一覧</h3>
    <div id="productList" style="display: grid; gap: 15px;">
      <p style="text-align: center; color: #888;">読み込み中...</p>
    </div>

  </div>

<!-- QRスキャナー用モーダル -->
<div id="scannerModal" onclick="stopScanner()" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 9999; overflow-y: auto; padding: 20px 15px; box-sizing: border-box;">
  
  <!-- 内側のカード（タップが背景に抜けないよう stopPropagation を指定） -->
  <div onclick="event.stopPropagation()" style="background: white; border-radius: 16px; padding: 20px; width: 100%; max-width: 360px; margin: 40px auto; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); position: relative; z-index: 10000;">
    
    <h3 style="margin-top: 0; color: #333; font-size: 1.1rem;">ブースのQRコードをかざしてください</h3>
    <p id="targetProductName" style="font-size: 0.95rem; color: #ff9500; font-weight: bold; margin-bottom: 12px;"></p>

    <p style="font-size: 0.75rem; color: #888; margin-bottom: 12px;">
      ※景品交換ブースに設置されている専用QRを読み取ってください
    </p>
    
    <!-- スキャナー枠 -->
    <div id="reader" style="width: 100%; border-radius: 12px; overflow: hidden; background: #000; min-height: 200px;"></div>

    <!-- 💡 onclick / ontouchstart を直接HTMLに記述 -->
    <button type="button" id="closeScannerBtn" onclick="stopScanner()" ontouchstart="stopScanner()" class="btn" style="margin-top: 20px; background: #8e8e93; color: white; width: 100%; padding: 14px; font-size: 1rem; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; position: relative; z-index: 10001; -webkit-tap-highlight-color: transparent;">
      キャンセル
    </button>

  </div>

</div>

</body>
</html>
