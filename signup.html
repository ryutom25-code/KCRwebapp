<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規登録 - オープンキャンパス</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/env.js" defer></script>
  <script src="js/signup.js" defer></script>
  <!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#007aff">

<!-- iOS（Safari）対応設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OCアプリ">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body class="centered-body">
  <div class="card">
    <h1>新規アカウント登録</h1>
    <form id="signupForm">
      <div class="form-group">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" required placeholder="example@email.com">
      </div>
      <div class="form-group">
        <label for="password">パスワード (8文字以上)</label>
        <input type="password" id="password" required minlength="6" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-success">次へ（プロフィール入力）</button>
    </form>
    <div class="link-text">
      すでにアカウントをお持ちの方は <a href="login.html">ログイン</a>
    </div>
  </div>
</body>
</html>
