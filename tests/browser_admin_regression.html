<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Login-free management regression</title>
<script src="../js/common.js"></script>
<script>
const supabaseInitPromise = Promise.resolve();
const tables = [];
window.supabaseClient = {
  auth: { getUser() { throw new Error('ログイン確認は禁止'); } },
  rpc() { throw new Error('is_adminの呼び出しは禁止'); },
  from(table) {
    tables.push(table);
    const query = { then(resolve,reject) { return Promise.resolve({count:table==='checkins'?2:3}).then(resolve,reject); } };
    for (const method of ['select','gte','or']) query[method]=()=>query;
    return query;
  }
};
</script>
<script src="../admin/js/dashboard.js" defer></script>
</head><body>
<div id="todayCheckins">--</div><div id="todayExchanges">--</div>
<pre id="testResult">RUNNING</pre>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  await new Promise(resolve=>setTimeout(resolve,0));
  const ok = document.getElementById('todayCheckins').textContent.startsWith('2 ')
    && document.getElementById('todayExchanges').textContent.startsWith('3 ')
    && tables.join(',')==='checkins,point_history';
  document.getElementById('testResult').textContent=ok
    ? 'PASS: dashboard loaded without login or is_admin RPC'
    : 'FAIL: dashboard did not initialize';
});
</script></body></html>
